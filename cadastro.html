<body data-root="" data-pagina="cadastro">
<main id="principal">
<div class="contem"><div class="auth">
<h1>Criar conta</h1>
<p class="suave">Leva um minuto. Você ganha o cupom LUZ10 (10% na primeira compra).</p>
<p id="aviso" class="alerta" role="alert" tabindex="-1" hidden></p>
<form id="form-cadastro" novalidate>
<div class="campo" id="c-nome"><label for="nome">Nome completo</label><input id="nome" name="nome" type="text" autocomplete="name"><p class="erro-msg" id="e-nome" hidden></p></div>
<div class="campo" id="c-email"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email"><p class="erro-msg" id="e-email" hidden></p></div>
<div class="grade2"><div class="campo" id="c-cpf"><label for="cpf">CPF</label><input id="cpf" name="cpf" type="text" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00"><p class="ajuda">Usado na nota fiscal.</p><p class="erro-msg" id="e-cpf" hidden></p></div><div class="campo" id="c-tel"><label for="tel">Telefone com DDD</label><input id="tel" name="tel" type="tel" autocomplete="tel"><p class="erro-msg" id="e-tel" hidden></p></div></div>
<div class="grade2"><div class="campo" id="c-senha"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="new-password"><p class="ajuda">Pelo menos 8 caracteres.</p><p class="erro-msg" id="e-senha" hidden></p></div><div class="campo" id="c-senha2"><label for="senha2">Repita a senha</label><input id="senha2" name="senha2" type="password" autocomplete="new-password"><p class="erro-msg" id="e-senha2" hidden></p></div></div>
<div class="campo" id="c-aceite"><label style="display:flex;gap:10px;align-items:flex-start;font-weight:500"><input type="checkbox" id="aceite" style="margin-top:5px;accent-color:#2f4a3a"><span>Li e aceito a <a href="privacidade.html" target="_blank" rel="noopener">Política de privacidade</a>.</span></label><p class="erro-msg" id="e-aceite" hidden></p></div>
<button class="btn btn-bloco" id="criar" type="submit">Criar conta</button></form>
<p style="margin-top:20px">Já tem conta? <a id="link-login" href="login.html">Entrar</a></p>
<p class="pequeno suave">Demonstração acadêmica: os dados ficam salvos só neste navegador. Não use dados pessoais reais se preferir.</p>
</div></div>
</main>
<noscript><p style="padding:20px;text-align:center">Ative o JavaScript para usar o carrinho e a conta.</p></noscript>
<script src="js/config.js"></script>
<script src="js/produtos.js"></script>
<script src="js/analytics.js"></script>

<script src="js/conta.js"></script>
</body>
